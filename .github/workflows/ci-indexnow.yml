name: CI Build Guard & IndexNow Auto-Ping

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-ping-indexnow:
    name: Astro Check, Build & IndexNow Ping
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro & TypeScript diagnostics
        run: npm run check

      - name: Build static site & Pagefind search index
        run: npm run build

      - name: Wait 45s for Cloudflare Pages edge propagation
        run: sleep 45

      - name: Notify IndexNow of canonical sitemap URLs
        run: node scripts/ping-indexnow.mjs
