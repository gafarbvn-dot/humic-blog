<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Humic Acid vs. Fulvic Acid vs. Humin pH Solubility Spectrum and Molecular Weight</title>
  <desc id="desc">Visual comparison across pH 1 to 14 showing Fulvic Acid soluble across all pH (~500-2,000 Da), Humic Acid precipitating below pH 4.5 and soluble in neutral to alkaline solutions (~2,000-100,000+ Da apparent supramolecular size), and Humin insoluble across all pH values.</desc>
  <rect width="840" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Header Bar -->
  <rect x="0" y="0" width="840" height="52" rx="14" fill="#064e3b"/>
  <rect x="0" y="38" width="840" height="14" fill="#064e3b"/>
  <text x="24" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Humic Substances: pH 1–14 Solubility Spectrum &amp; Apparent Molecular Size</text>
  <rect x="655" y="14" width="162" height="24" rx="12" fill="#f59e0b"/>
  <text x="736" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#022c22">IHSS &amp; ISO 19822 BASIS</text>

  <!-- Chart Plot Container -->
  <rect x="24" y="68" width="560" height="244" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Acid Precipitation Zone (pH 1 to 4.5) -->
  <rect x="78" y="88" width="142" height="178" fill="#fef2f2"/>
  <text x="149" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">ACID PRECIPITATION</text>
  <text x="149" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#991b1b">(pH 1.0 – 4.5)</text>
  <!-- Stable Neutral/Alkaline Zone -->
  <rect x="220" y="88" width="346" height="178" fill="#ecfdf5" fill-opacity="0.6"/>
  <text x="393" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">NEUTRAL TO ALKALINE SOLUTION ZONE (pH 5.0 – 14.0)</text>

  <!-- Axes -->
  <line x1="78" y1="266" x2="566" y2="266" stroke="#334155" stroke-width="1.5"/>
  <line x1="78" y1="88" x2="78" y2="266" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="88" x2="220" y2="266" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Y-Axis Labels -->
  <text x="68" y="138" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#334155">100%</text>
  <text x="68" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">50%</text>
  <text x="68" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#334155">0%</text>
  <text x="39" y="180" text-anchor="middle" transform="rotate(-90 39 180)" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#064e3b">Aqueous Solubility</text>

  <!-- X-Axis Ticks -->
  <g font-family="system-ui, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">
    <text x="78" y="286">pH 1</text>
    <text x="152" y="286">pH 3</text>
    <text x="220" y="286" font-weight="700" fill="#b91c1c">pH 4.5</text>
    <text x="302" y="286">pH 7</text>
    <text x="378" y="286">pH 9</text>
    <text x="454" y="286">pH 11</text>
    <text x="558" y="286">pH 14</text>
  </g>
  <text x="322" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#475569">Solution pH Scale</text>

  <!-- Fulvic Acid Curve (Amber) -->
  <line x1="78" y1="136" x2="562" y2="136" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="292" y="122" width="246" height="22" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="415" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Fulvic Acid — Soluble Across All pH (1–14)</text>

  <!-- Humic Acid Curve (Forest Green) -->
  <path d="M 78 258 L 194 256 C 216 254, 224 166, 266 156 L 562 154" fill="none" stroke="#065f46" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="280" y="164" width="268" height="22" rx="6" fill="#ecfdf5" stroke="#065f46"/>
  <text x="414" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#064e3b">Humic Acid — Precipitates &lt; pH 4.5; Soluble in Alkali</text>

  <!-- Humin Curve (Slate Dashed) -->
  <line x1="78" y1="262" x2="562" y2="262" stroke="#334155" stroke-width="3.5" stroke-dasharray="8,5"/>
  <rect x="312" y="232" width="224" height="22" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="424" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Humin — Insoluble Across All pH</text>

  <!-- Right Panel: Relative Molecular Size -->
  <rect x="600" y="68" width="216" height="244" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="708" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#064e3b">Relative Apparent Size</text>

  <!-- Fulvic Bubble -->
  <circle cx="642" cy="134" r="14" fill="#f59e0b"/>
  <text x="642" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#022c22">FA</text>
  <text x="668" y="129" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Fulvic Acid</text>
  <text x="668" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#475569">~500 – 2,000 Da</text>
  <text x="668" y="157" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">High O/C, mobile foliar</text>

  <!-- Humic Bubble -->
  <circle cx="642" cy="202" r="24" fill="#065f46"/>
  <text x="642" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">HA</text>
  <text x="676" y="194" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#064e3b">Humic Acid</text>
  <text x="676" y="209" font-family="system-ui, sans-serif" font-size="10" fill="#475569">2k – 100k+ Da (agg.)</text>
  <text x="676" y="222" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">Supramolecular clusters</text>

  <!-- Humin Block -->
  <rect x="614" y="252" width="56" height="36" rx="8" fill="#334155"/>
  <text x="642" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">HUMIN</text>
  <text x="680" y="266" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">Humin</text>
  <text x="680" y="281" font-family="system-ui, sans-serif" font-size="10" fill="#475569">&gt;100k Da / Clay-Bound</text>
  <text x="680" y="294" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">Long-term soil carbon</text>

  <!-- Footer Attribution -->
  <text x="24" y="346" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Operational fractionation defined by aqueous solubility (IHSS) and verified ash-free via ISO 19822 (DAX-8 resin for hydrophobic fulvic acid).</text>
  <text x="24" y="364" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">Humic.blog — Open Educational Soil Science Encyclopedia</text>
</svg>
