<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Humic and Fulvic Acid Micronutrient Chelation Mechanism in Alkaline Soil</title>
  <desc id="desc">Diagram showing how humic and fulvic carboxylate (-COO-) and phenolic hydroxyl (-OH) functional groups surround and protect divalent micronutrients (Fe2+, Zn2+, Ca2+) from precipitating with carbonates in alkaline soil, transporting them to the root hair for uptake.</desc>
  <defs>
    <marker id="arr-g2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#065f46"/></marker>
    <marker id="arr-r2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="0" y="0" width="860" height="52" rx="14" fill="#064e3b"/>
  <rect x="0" y="38" width="860" height="14" fill="#064e3b"/>
  <text x="24" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Humic &amp; Fulvic Chelation: Protecting Micronutrients to the Root Hair</text>
  <rect x="652" y="14" width="184" height="24" rx="12" fill="#f59e0b"/>
  <text x="744" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#022c22">RHIZOSPHERE DELIVERY</text>

  <!-- Left Box: Unprotected Cation Lockup -->
  <rect x="22" y="72" width="218" height="236" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="131" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">1. Unprotected Cation</text>
  <text x="131" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">(Alkaline / Calcareous Soil)</text>
  <circle cx="84" cy="156" r="21" fill="#d97706"/>
  <text x="84" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Fe²⁺/Zn²⁺</text>
  <text x="128" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#991b1b">+</text>
  <rect x="148" y="138" width="76" height="36" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="186" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">OH⁻ / CO₃²⁻</text>
  <text x="186" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">High-pH Ions</text>
  <line x1="131" y1="184" x2="131" y2="216" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-r2)"/>
  <rect x="42" y="224" width="178" height="66" rx="8" fill="#7f1d1d"/>
  <text x="131" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fde68a">LOCKED PRECIPITATE</text>
  <text x="131" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Fe(OH)₃ / ZnCO₃ / Ca-PO₄</text>
  <text x="131" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#fecaca">Unavailable to plant roots</text>

  <!-- Center Box: Humic/Fulvic Chelation Shield -->
  <rect x="258" y="72" width="332" height="236" rx="10" fill="#ffffff" stroke="#065f46" stroke-width="2"/>
  <text x="424" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#064e3b">2. Humic / Fulvic Chelation Complex</text>
  <text x="424" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Carboxyl (–COO⁻) &amp; Phenolic (–OH) Ligands Shield Cation</text>

  <!-- Aromatic Backbone Ring -->
  <polygon points="300,164 334,144 368,164 368,204 334,224 300,204" fill="#ecfdf5" stroke="#065f46" stroke-width="2.5"/>
  <text x="334" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#064e3b">Humic /</text>
  <text x="334" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#064e3b">Fulvic Core</text>

  <!-- Ligand Arms -->
  <line x1="368" y1="164" x2="412" y2="152" stroke="#065f46" stroke-width="2.5"/>
  <rect x="412" y="138" width="60" height="24" rx="6" fill="#065f46"/>
  <text x="442" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">–COO⁻</text>

  <line x1="368" y1="204" x2="412" y2="216" stroke="#065f46" stroke-width="2.5"/>
  <rect x="412" y="204" width="60" height="24" rx="6" fill="#065f46"/>
  <text x="442" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">–O⁻ / –OH</text>

  <!-- Coordinate Bonds to Protected Cation -->
  <line x1="472" y1="152" x2="508" y2="174" stroke="#d97706" stroke-width="3" stroke-dasharray="4,3"/>
  <line x1="472" y1="214" x2="508" y2="194" stroke="#d97706" stroke-width="3" stroke-dasharray="4,3"/>
  <circle cx="534" cy="184" r="30" fill="#f59e0b" stroke="#064e3b" stroke-width="2"/>
  <text x="534" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#022c22">Fe²⁺ / Zn²⁺</text>
  <text x="534" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#022c22">Ca²⁺</text>

  <!-- Protection Note -->
  <rect x="276" y="248" width="296" height="46" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="424" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Protective Ring Prevents Carbonate Lockup</text>
  <text x="424" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">(Note: Keep Ca²⁺ separate from concentrated K-Humate tanks; use Fulvic)</text>

  <!-- Delivery Arrow to Root Hair -->
  <line x1="590" y1="184" x2="626" y2="184" stroke="#065f46" stroke-width="3" marker-end="url(#arr-g2)"/>

  <!-- Right Box: Root Hair Uptake -->
  <rect x="634" y="72" width="204" height="236" rx="10" fill="#064e3b"/>
  <text x="736" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">3. Root Hair Delivery</text>
  <text x="736" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#d1fae5">Rhizosphere Release &amp; Uptake</text>

  <!-- Stylized Root Hair Graphic -->
  <path d="M 790 128 C 776 155, 766 170, 738 178 C 708 186, 676 184, 658 190 C 676 202, 712 200, 742 206 C 768 212, 778 232, 792 256 L 818 256 L 818 128 Z" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <circle cx="678" cy="191" r="10" fill="#f59e0b"/>
  <text x="678" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#022c22">M²⁺</text>

  <text x="736" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">&bull; Root H⁺-ATPase releases M²⁺</text>
  <text x="736" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#d1fae5">&bull; Higher Fe/Zn/P bioavailability</text>

  <!-- Footer -->
  <text x="24" y="332" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Root exudates &amp; proton extrusion (H⁺-ATPase) release chelated micronutrients at the root membrane for active uptake.</text>
  <text x="24" y="349" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">Humic.blog — Open Educational Soil Science Encyclopedia</text>
</svg>
