<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">4-Stage Industrial Alkaline Extraction Flowchart: Leonardite to Potassium Humate</title>
  <desc id="desc">Industrial process showing Raw Oxidized Leonardite crushed and milled, digested with KOH (agronomic Potassium Humate) versus NaOH (clay-dispersing industrial Sodium Humate), centrifuged to remove ash and humin, and dried via drum-flaking or spray-drying.</desc>
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#065f46"/></marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="0" y="0" width="860" height="52" rx="14" fill="#064e3b"/>
  <rect x="0" y="38" width="860" height="14" fill="#064e3b"/>
  <text x="24" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Industrial Alkaline Extraction Flowchart: Leonardite &rarr; Potassium Humate</text>
  <rect x="688" y="14" width="148" height="24" rx="12" fill="#f59e0b"/>
  <text x="762" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#022c22">4-STAGE PROCESS</text>

  <!-- Stage 1 -->
  <rect x="22" y="88" width="154" height="132" rx="10" fill="#064e3b"/>
  <rect x="34" y="98" width="66" height="18" rx="9" fill="#f59e0b"/>
  <text x="67" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#022c22">STAGE 1</text>
  <text x="99" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Raw Oxidized</text>
  <text x="99" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Leonardite</text>
  <text x="99" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#d1fae5">Crushing &amp; Milling</text>
  <text x="99" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">(40–85% Insoluble HA)</text>

  <!-- Split Arrows to Stage 2 -->
  <path d="M 176 135 L 220 112" fill="none" stroke="#065f46" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <path d="M 176 178 L 220 250" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <!-- Stage 2A: KOH Digestion (Recommended) -->
  <rect x="228" y="74" width="182" height="106" rx="10" fill="#ffffff" stroke="#065f46" stroke-width="2"/>
  <rect x="240" y="84" width="102" height="18" rx="9" fill="#065f46"/>
  <text x="291" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">STAGE 2 • KOH</text>
  <text x="319" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#064e3b">Alkaline Digestion</text>
  <text x="319" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Potassium Hydroxide (KOH)</text>
  <text x="319" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#065f46">60–85 °C &rarr; Soluble –COO⁻ K⁺</text>

  <!-- Stage 2B: NaOH Warning Path -->
  <rect x="228" y="204" width="182" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="319" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">NaOH Path (Avoid in Soil)</text>
  <text x="319" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">Sodium Humate (6–10% Na⁺)</text>
  <text x="319" y="261" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">Disperses clay, seals pores,</text>
  <text x="319" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">elevates soil sodicity (ESP)</text>

  <!-- Arrow 2A -> 3 -->
  <line x1="410" y1="127" x2="452" y2="127" stroke="#065f46" stroke-width="2.5" marker-end="url(#arr-g)"/>

  <!-- Stage 3: Centrifugation -->
  <rect x="460" y="74" width="174" height="106" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="472" y="84" width="70" height="18" rx="9" fill="#f59e0b"/>
  <text x="507" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#022c22">STAGE 3</text>
  <text x="547" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#064e3b">Centrifugation</text>
  <text x="547" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Decanter &amp; Fine Filtration</text>
  <text x="547" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">Removes Ash &amp; Humin (&lt;1.5% WIM)</text>

  <!-- Ash Waste Drop Arrow -->
  <line x1="547" y1="180" x2="547" y2="218" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-a)"/>
  <rect x="466" y="226" width="162" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="547" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Removed Insolubles</text>
  <text x="547" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Silicate clay, sand &amp; humin cake</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="634" y1="127" x2="672" y2="127" stroke="#065f46" stroke-width="2.5" marker-end="url(#arr-g)"/>

  <!-- Stage 4: Drying & Finished Product -->
  <rect x="680" y="74" width="158" height="196" rx="10" fill="#065f46"/>
  <rect x="692" y="84" width="70" height="18" rx="9" fill="#f59e0b"/>
  <text x="727" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#022c22">STAGE 4</text>
  <text x="759" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Dehydration &amp;</text>
  <text x="759" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">Potassium Humate</text>
  <line x1="696" y1="152" x2="822" y2="152" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="759" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">&bull; Drum-Flaked</text>
  <text x="759" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#d1fae5">Shiny crystals, low dust</text>
  <text x="759" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">&bull; Spray-Dried</text>
  <text x="759" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#d1fae5">Instant drip-grade powder</text>
  <text x="759" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">65–82% HA • 8–12% K₂O</text>

  <!-- Footer -->
  <text x="24" y="330" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Agronomic specification target: KOH extraction (Na &lt; 1.5%, S &lt; 0.75%, WIM &lt; 1.5% for 120-mesh drip fertigation).</text>
  <text x="24" y="347" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">Humic.blog — Open Educational Soil Science Encyclopedia</text>
</svg>
